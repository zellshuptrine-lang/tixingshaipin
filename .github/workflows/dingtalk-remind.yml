name: 每日18点筛品提醒

on:
  workflow_dispatch: # 允许手动触发测试
  schedule:
    - cron: '0 10 * * *' # UTC时间10点=北京时间18点，每天执行

jobs:
  send-remind:
    runs-on: ubuntu-latest
    steps:
      - name: 发送钉钉提醒
        run: |
          curl -X POST ${{ secrets.DINGTALK_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "text",
            "text": {
              "content": "📅 每日提醒：今天的筛品时间到啦，请大家及时处理！"
            },
            "at": {
              "isAtAll": true
            }
          }'
